name: SonarQube analysis

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SonarQube Scanner (Java 17 compatible)
        run: |
          docker run --rm \
            -e SONAR_HOST_URL="${{ secrets.SONAR_HOST_URL }}" \
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
            -v "$(pwd)":/usr/src \
            sonarsource/sonar-scanner-cli:10 \
            -Dsonar.projectKey=jayachandradev_Altroz \
            -Dsonar.organization=jayachandradev
            -Dsonar.verbose=true
