# SonarQube Analysis Workflow
# This workflow triggers SonarQube code analysis on pushes, PRs, and manual runs.

name: SonarQube analysis

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarQube to decorate PRs with analysis results

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze with SonarQube

      # You can pin the exact commit or the version.
        # uses: SonarSource/sonarqube-scan-action@v1.1.0
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # Required for PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # Add this in repo secrets
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # Add your SonarQube instance URL
        with:
           # Additional arguments for the sonarcloud scanner
          args:
            # Unique key of your project. You can find it in SonarQube > [my project] > Project Information (top-right menu)
            # mandatory
            -Dsonar.projectKey=jayachandradev_Altroz
            # Optional custom paths (uncomment if needed)
            # -Dsonar.sources=src
            # -Dsonar.tests=tests
            # -Dsonar.projectBaseDir=.

